# 프로젝트명을 명시한다 — 생략하면 **폴더명에서 유도**되므로, 폴더를 옮기거나 이름을 바꾸는
# 순간 볼륨이 <폴더명>_postgres_data로 갈라져 DB가 빈 것처럼 보인다. 시드 소스가 유실된
# pb_customers·pb_sessions(HANDOFF §2)가 여기 들어 있어 조용히 갈라지면 안 된다.
name: ai-pb-agent

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - '8000:8000'
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DART_MCP_PYTHON: python3
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      # 이 대시보드의 주인. PB 1인용이므로 고객·상담·브리핑 유니버스가 전부 이 값으로
      # 좁혀진다. 사람 이름이 아니라 역할명이 기본값이다(사용자가 한 명이라 구분할 게 없다).
      # 프론트의 MY_PB(types.ts)와 같은 값이어야 한다.
      PB_NAME: ${PB_NAME:-PB}
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 --webpack"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # /dashboard 프록시는 Next 서버가 컨테이너 네트워크에서 호출하므로 서비스명을 쓴다
      # (브라우저에서 쓰는 위 주소와 달라야 한다).
      BACKEND_ORIGIN: http://backend:8000

  postgres:
    # 순정 16이다. 기획서는 F5(규정 RAG)에 pgvector를 쓴다고 적어 두었지만 지금 스키마에
    # 벡터 컬럼도, 코드에 임베딩 경로도 없다 — 안 쓰는 확장을 이미지로 끌고 다니지 않는다.
    # F5를 실제로 붙일 때 pgvector/pgvector:pg16으로 되돌리고 CREATE EXTENSION vector를 더한다.
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
