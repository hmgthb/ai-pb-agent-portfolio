services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - '8000:8000'
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DART_MCP_PYTHON: python3
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 --webpack"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # /dashboard 프록시는 Next 서버가 컨테이너 네트워크에서 호출하므로 서비스명을 쓴다
      # (브라우저에서 쓰는 위 주소와 달라야 한다).
      BACKEND_ORIGIN: http://backend:8000

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
